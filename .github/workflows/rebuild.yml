name: rebuild-cockpit

# 触发条件：
#   ① 金山 AirScript（read_daily.js）推 _incoming/data.json —— 销量/金额/渠道
#   ② 金山 AirScript（flow_push.js）推 _incoming/flow.json —— 前一日车流/单加
# 两者都会重建页面；同时到达时靠 concurrency 合并，不会重建两次页面。
on:
  push:
    paths:
      - '_incoming/data.json'
      - '_incoming/flow.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-cockpit
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 应用最新日报数据
        run: |
          ls -l _incoming/data.json
          python -c "import json;d=json.load(open('_incoming/data.json',encoding='utf-8'));print('天数',d['meta']['days_with_data'],'站数',d['meta']['station_count'])"
          cp _incoming/data.json _kdocs/data.json

      # 车流是独立的一条链路（15 个非油 V1 报表，销售日报里没有车次字段）。
      # 收到 AirScript 推的 flow.json 先过一遍校验：站数够不够、逐站「总车次=汽+柴」、
      # check 合计与逐站加总是否一致、asof 有没有跑到未来。
      # 不合格就**不采用**，沿用 _kdocs/_flow.json 里上一次的快照 ——
      # 页面照常出（销量/金额照常更新），只是车流停在旧日期，绝不把缺站的数字摆上台面。
      - name: 应用最新车流数据（先校验）
        run: |
          if [ -f _incoming/flow.json ]; then
            if python _kdocs/verify_flow.py _incoming/flow.json _kdocs/_flow.json; then
              cp _incoming/flow.json _kdocs/_flow.json
              echo "✅ 已采用本次车流数据"
            else
              echo "::warning::车流数据未通过校验，本次沿用 _kdocs/_flow.json 旧快照"
            fi
          else
            echo "未收到 _incoming/flow.json —— 沿用 _kdocs/_flow.json 里的现有快照"
          fi
          python -c "import json;d=json.load(open('_kdocs/_flow.json',encoding='utf-8'));print('本次使用车流 asof',d.get('asof'),'站数',len(d.get('stations') or {}))"

      - name: 重建驾驶舱
        run: python _kdocs/build_cockpit2.py

      - name: 发布到站点根目录
        run: |
          cp cockpit/index.html index.html
          ls -l index.html

      - name: 提交变更
        run: |
          git config user.name  "cockpit-bot"
          git config user.email "cockpit-bot@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "页面无变化，跳过提交"
          else
            git commit -m "auto: rebuild cockpit $(date -u '+%m-%d %H:%M') UTC"
            git push
            echo "已提交"
          fi
